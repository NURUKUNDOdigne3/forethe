<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forêt H.E Inc. — Forestry Management</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --forest: #1B3A2D;
    --forest-mid: #2D5A42;
    --forest-light: #3E7A59;
    --sage: #7CB897;
    --gold: #C9973A;
    --gold-light: #E0B96A;
    --cream: #F7F3EC;
    --cream-dark: #EDE8DF;
    --charcoal: #1A1A1A;
    --text-muted: #6B7B6E;
    --white: #FFFFFF;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }

  body {
    font-family: 'Outfit', sans-serif;
    background: var(--cream);
    color: var(--charcoal);
    overflow-x: hidden;
  }

  /* ── NAVBAR ── */
  nav {
    position: fixed; top: 0; width: 100%; z-index: 1000;
    padding: 1.2rem 5%;
    display: flex; align-items: center; justify-content: space-between;
    transition: all 0.4s ease;
    background: transparent;
  }
  nav.scrolled {
    background: rgba(27, 58, 45, 0.97);
    backdrop-filter: blur(12px);
    padding: 0.9rem 5%;
    box-shadow: 0 2px 30px rgba(0,0,0,0.25);
  }
  .nav-logo {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.5rem; font-weight: 600;
    color: var(--white); letter-spacing: 0.05em;
    text-decoration: none;
  }
  .nav-logo span { color: var(--gold); }
  .nav-links { display: flex; gap: 2.5rem; list-style: none; align-items: center; }
  .nav-links a {
    color: rgba(255,255,255,0.85); text-decoration: none;
    font-size: 0.9rem; font-weight: 400; letter-spacing: 0.08em;
    text-transform: uppercase; transition: color 0.3s;
  }
  .nav-links a:hover { color: var(--gold-light); }
  .nav-cta {
    background: var(--gold); color: var(--white) !important;
    padding: 0.55rem 1.4rem; border-radius: 2px;
    font-weight: 500 !important;
    transition: background 0.3s !important;
  }
  .nav-cta:hover { background: var(--gold-light) !important; color: var(--charcoal) !important; }

  /* ── HERO ── */
  .hero {
    min-height: 100vh; position: relative;
    display: flex; align-items: center; justify-content: flex-start;
    overflow: hidden;
  }
  .hero-slides {
    position: absolute; inset: 0; z-index: 0;
  }
  .hero-slide {
    position: absolute; inset: 0;
    background-size: cover; background-position: center; background-repeat: no-repeat;
    opacity: 0; transition: opacity 1.2s ease-in-out;
  }
  .hero-slide.active { opacity: 1; }
  .hero-slide::after {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(160deg, rgba(13,34,24,0.72) 0%, rgba(27,58,45,0.68) 40%, rgba(45,90,66,0.65) 80%, rgba(26,53,38,0.72) 100%);
  }
  .hero-dots {
    position: absolute; bottom: 3.5rem; left: 50%; transform: translateX(-50%);
    display: flex; gap: 0.55rem; z-index: 3;
  }
  .hero-dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: rgba(255,255,255,0.3); border: 1px solid rgba(255,255,255,0.5);
    cursor: pointer; transition: background 0.3s, transform 0.3s;
  }
  .hero-dot.active { background: var(--gold); border-color: var(--gold); transform: scale(1.3); }
  .hero-pattern {
    position: absolute; inset: 0; opacity: 0.06;
    background-image: repeating-linear-gradient(
      45deg, transparent, transparent 40px,
      rgba(255,255,255,0.5) 40px, rgba(255,255,255,0.5) 41px
    );
  }
  .hero-content {
    position: relative; z-index: 2;
    text-align: left; padding: 1rem 0 1rem 5%;
    max-width: 600px;
    animation: fadeUp 1s ease both;
    display: flex; flex-direction: column; align-items: flex-start; justify-content: center;
    margin-right: auto;
  }
  .hero-eyebrow {
    display: inline-block;
    font-size: 0.85rem; letter-spacing: 0.2em; text-transform: uppercase;
    color: var(--gold-light); font-weight: 500;
    border-top: 1px solid var(--gold); border-bottom: 1px solid var(--gold);
    padding: 0.35rem 1rem; margin-bottom: 1rem;
    margin-left: 0;
  }
  .hero h1 {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(2.8rem, 7vw, 5.5rem);
    font-weight: 300; line-height: 1.1;
    color: var(--white); margin-bottom: 1.2rem;
    letter-spacing: -0.01em;
  }
  .hero h1 em { font-style: italic; color: var(--sage); }
  .hero-sub {
    font-size: clamp(1rem, 1.8vw, 1.15rem); color: rgba(255,255,255,0.7);
    max-width: 560px; margin: 0 0 1.5rem 0; line-height: 1.6;
    font-weight: 300;
  }
  .hero-btns { display: flex; gap: 0.6rem; justify-content: flex-start; flex-wrap: wrap; margin-bottom: 0.5rem; }
  .btn-primary {
    background: var(--gold); color: var(--white);
    padding: 0.9rem 2rem; text-decoration: none;
    font-size: 0.9rem; letter-spacing: 0.08em; text-transform: uppercase;
    font-weight: 500; transition: all 0.3s; border-radius: 2px;
    display: inline-block;
  }
  .btn-primary:hover { background: var(--gold-light); color: var(--charcoal); transform: translateY(-2px); }
  .btn-outline {
    background: transparent; color: var(--white);
    border: 1px solid rgba(255,255,255,0.5);
    padding: 0.9rem 2rem; text-decoration: none;
    font-size: 0.9rem; letter-spacing: 0.08em; text-transform: uppercase;
    font-weight: 400; transition: all 0.3s; border-radius: 2px;
    display: inline-block;
  }
  .btn-outline:hover { border-color: white; background: rgba(255,255,255,0.1); transform: translateY(-2px); }
  .hero-scroll {
    position: absolute; bottom: 1rem; left: 50%; transform: translateX(-50%);
    display: flex; flex-direction: column; align-items: center; gap: 0.3rem;
    color: rgba(255,255,255,0.4); font-size: 0.6rem; letter-spacing: 0.12em; text-transform: uppercase;
    animation: bounce 2s infinite;
  }
  .hero-scroll::after {
    content: ''; width: 1px; height: 50px;
    background: linear-gradient(to bottom, rgba(255,255,255,0.4), transparent);
  }

  /* ── ANIMATIONS ── */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes bounce {
    0%, 100% { transform: translateX(-50%) translateY(0); }
    50% { transform: translateX(-50%) translateY(8px); }
  }

  /* ── RESPONSIVE ── */
  @media (max-width: 900px) {
    .nav-links { display: none; }
  }
</style>
</head>
<body>

<!-- NAV -->
<nav id="navbar">
  <a href="#" class="nav-logo"><img src="imgs/logo.png" alt="Forêt H.E Inc. Logo" style="height: 45px; width: auto;"></a>
  <ul class="nav-links">
    <li><a href="#home">Home</a></li>
    <li><a href="services.html">Services</a></li>
    <li><a href="#about">About us</a></li>
    <li><a href="#team">Team</a></li>
    <li><a href="#contact" class="nav-cta">Contact us</a></li>
  </ul>
</nav>

<!-- HERO -->
<section class="hero">
  <div class="hero-slides">
    <div class="hero-slide active" style="background-image: url('imgs/hero_image.png')"></div>
    <div class="hero-slide" style="background-image: url('imgs/hero_image_2.png')"></div>
    <div class="hero-slide" style="background-image: url('imgs/hero_image_3.png')"></div>
  </div>
  <div class="hero-pattern"></div>
  <div class="hero-content">
    <div class="hero-eyebrow">
      <span>Gatineau, Québec · Canada</span>
    </div>
    <h1>Forestry<em>excellence</em>,<br>at your service</h1>
    <p class="hero-sub">Forêt H.E Inc. delivers professional forestry management services with a skilled, safe, and dedicated workforce.</p>
    <div class="hero-btns">
      <a href="#services" class="btn-primary">Our services</a>
      <a href="#contact" class="btn-outline">Get a quote</a>
    </div>
  </div>
  <div class="hero-dots" id="heroDots">
    <div class="hero-dot active" onclick="goToSlide(0)"></div>
    <div class="hero-dot" onclick="goToSlide(1)"></div>
    <div class="hero-dot" onclick="goToSlide(2)"></div>
  </div>
  <div class="hero-scroll">
    <span>Scroll</span>
  </div>
</section>

<script>
  // Hero slideshow
  const slides = document.querySelectorAll('.hero-slide');
  const dots = document.querySelectorAll('.hero-dot');
  let currentSlide = 0;
  let slideshowTimer;

  function goToSlide(index) {
    slides[currentSlide].classList.remove('active');
    dots[currentSlide].classList.remove('active');
    currentSlide = index;
    slides[currentSlide].classList.add('active');
    dots[currentSlide].classList.add('active');
    clearInterval(slideshowTimer);
    slideshowTimer = setInterval(nextSlide, 3000);
  }

  function nextSlide() {
    goToSlide((currentSlide + 1) % slides.length);
  }

  slideshowTimer = setInterval(nextSlide, 3000);

  // Navbar scroll
  const nav = document.getElementById('navbar');
  window.addEventListener('scroll', () => {
    nav.classList.toggle('scrolled', window.scrollY > 60);
  });
</script>
</body>
</html>
